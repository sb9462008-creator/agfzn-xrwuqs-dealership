<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Best Cars Dealership</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/">Best Cars Dealership</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
            <li class="nav-item active"><a class="nav-link active" href="/contact">Contact Us</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="text-center mb-2">Contact Us</h1>
    <p class="text-center text-muted mb-5">We'd love to hear from you</p>
    <div class="row">
        <div class="col-md-6">
            <div class="card p-4 mb-4">
                <h4>Headquarters</h4>
                <img src="https://images.unsplash.com/photo-1486325212027-8081e485255e?w=400" class="img-fluid rounded mb-3" alt="HQ">
                <p><strong>Address:</strong> 123 Auto Drive, Chicago, IL 60601</p>
                <p><strong>Phone:</strong> +1 (312) 555-0100</p>
                <p><strong>Email:</strong> <a href="mailto:info@bestcars.com">info@bestcars.com</a></p>
                <p><strong>Hours:</strong> Mon-Sat 9AM - 8PM, Sun 10AM - 6PM</p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4">
                <h4>Send us a Message</h4>
                <form>
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea class="form-control" rows="4" placeholder="Your message..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark btn-block">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
